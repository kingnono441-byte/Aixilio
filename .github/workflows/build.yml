name: Build Aixilio
on: [push]
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v3
    - name: Setup NDK
      uses: nttld/setup-ndk@v1
      with:
        ndk-version: r25b
    - name: Compile
      run: |
        $ANDROID_NDK_HOME/toolchains/llvm/prebuilt/linux-x86_64/bin/aarch64-linux-android30-clang++ main.cpp -o aixilio_bin -llog -ldl -pthread
    - name: Upload
      uses: actions/upload-artifact@v3
      with:
        name: aixilio-bin
        path: aixilio_bin
